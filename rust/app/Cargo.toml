[package]
name = "money-app"
description = "Money in Rust: the screens (Dioxus, rendered in the browser as WebAssembly)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
money-core = { path = "../core" }
dioxus = { version = "0.7", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "HtmlElement", "Location", "Request", "RequestInit", "RequestMode", "Response", "Headers", "console", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition"] }
