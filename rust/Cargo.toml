# Money: the engine (core), the app (app: the website and what the Android app carries) and the server's engine
# (server: the widget and 9 PM summary in the Supabase functions). See rust/README.md.
[workspace]
resolver = "2"
members = ["core", "app", "server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = "z"     # small WebAssembly for phones
lto = true
codegen-units = 1
panic = "abort"

# the checks run thousands of rewards searches: build them optimised
[profile.test]
opt-level = 2
