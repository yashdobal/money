# The Rust app (rust/): its engine must give the same figures as app/engine.js on the demo data, and then the app is
# built for the web and put live at https://rust.yash-money.pages.dev, a separate address in the same Cloudflare Pages
# project as the current website (which stays at yash-money.pages.dev and is not touched by this).
name: Rust
on:
  push:
    branches: [main]
    paths: ["rust/**", "app/**", "tools/rust/**", "tools/demo/**", "rn/src/icon-paths.js", "rn/src/engine.gen.js", "collector/money-collector.gs", ".github/workflows/rust.yml"]
  workflow_dispatch:
concurrency: { group: rust-site, cancel-in-progress: false }
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: The card rulebooks match app/trips.js and app/rewards.js
        run: node tools/rust/data.mjs --check
      - name: "Same figures as the current app (42 moments on the demo data, and 102 changes)"
        working-directory: rust
        run: cargo test -p money-core -- --nocapture
  site:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust, key: wasm }
      - name: wasm-bindgen (the same version as in Cargo.lock)
        uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen@0.2.130 }
      - name: Build the web app
        run: ./rust/build-web.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Put it live at rust.yash-money.pages.dev
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set, so the Rust site was not deployed"; exit 0; fi
          npx --yes wrangler@3.114.0 pages deploy rust/dist --project-name yash-money --branch rust --commit-hash "$(git rev-parse HEAD)"
      - name: Check the live Rust site has this build
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          want=$(python3 -c "import json;print(json.load(open('rust/dist/version.json'))['build'])")
          for i in 1 2 3 4 5 6; do
            got=$(curl -s "https://rust.yash-money.pages.dev/version.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('build',''))" || true)
            echo "live build: $got (want $want)"; [ "$got" = "$want" ] && exit 0; sleep 10
          done
          echo "::error::the Rust site doesn't show this build yet"; exit 1
