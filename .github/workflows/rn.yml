name: Money RN
# The React Native app (rn/): checks its engine is the website's own (generated and the same figures as the server),
# then generates the Android project (expo prebuild), builds the signed APK (the same key as the Money app), and on
# main attaches it to a GitHub Release tagged rn-<run>. Run by hand (Run workflow) it builds the demo app instead and
# opens it in an emulator. It installs next to the Money app (package com.yashdobal.money.rn).
# Needs the repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (already there for the Money app).
# Paused: changes go to the website and the Money app only, so this no longer runs on a push. rn/ is still the website's source; the Money RN APK is only built when run by hand.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: rn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screens:
    # every screen and sheet in a browser (the app's web preview) over the demo data: a click-through and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: rn
      - run: npm ci --prefix tools/ui --no-audit --no-fund
      - working-directory: tools/ui
        run: npx playwright install --with-deps chromium
      - name: Web preview
        working-directory: rn
        run: npx expo export --platform web --output-dir dist-web
      - name: Click-through
        run: node tools/ui/rn.click.test.mjs
      - name: Screenshots
        run: node tools/ui/rn.shots.mjs shots
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact store must not fail the checks
        if: always()
        with: { name: rn-screens, path: shots, retention-days: 3 }

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        working-directory: rn
        run: npm ci --no-audit --no-fund
      - name: The engine is the website's own, with the same figures as the server
        run: |
          node tools/rn_engine.mjs --check
          node tools/rn/engine.test.mjs
          node tools/rn/trips.test.mjs
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/money.jks"
            echo "MONEY_KEYSTORE=$RUNNER_TEMP/money.jks" >> "$GITHUB_ENV"
            echo "MONEY_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Add the secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"; exit 1
          else
            echo "::warning::No signing key, so this test build uses a throwaway key"
          fi
      - name: Generate the Android project
        working-directory: rn
        # a run with the emulator check builds the demo app (made-up data, signed in; never released)
        env: { CI: "1", EXPO_NO_TELEMETRY: "1", EXPO_PUBLIC_MONEY_DEMO: "${{ github.event_name == 'workflow_dispatch' && '1' || '' }}" }
        run: |
          mkdir -p ../logs
          npx expo prebuild --platform android --no-install --clean 2>&1 | tee ../logs/prebuild.log
          printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n" >> android/gradle.properties
          cp android/gradle.properties ../logs/gradle.properties
          cp android/app/build.gradle ../logs/app-build.gradle
          cp android/app/src/main/AndroidManifest.xml ../logs/AndroidManifest.xml
      - name: More memory for the C++ builds (Skia, Reanimated)
        # the runner's memory guard stops the build when the native compiles all run at once: add swap, and run fewer at a time
        # and room on the disk: clear the runner's preinstalled tools this build never uses (.NET, Haskell, Swift, CodeQL…)
        run: |
          df -h / /mnt 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/jvm/*-8-* 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo fallocate -l 6G /mnt/swap2 && sudo chmod 600 /mnt/swap2 && sudo mkswap /mnt/swap2 > /dev/null && sudo swapon /mnt/swap2 || true
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          free -h; df -h / /mnt 2>/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        working-directory: rn/android
        # the phone needs arm64 only; a run with the emulator check adds x86_64 so the emulator can run it natively
        env: { NODE_ENV: production, EXPO_PUBLIC_MONEY_DEMO: "${{ github.event_name == 'workflow_dispatch' && '1' || '' }}", GITHUB_RUN_NUMBER: "${{ github.run_number }}", ARCHS: "${{ github.event_name == 'workflow_dispatch' && 'arm64-v8a,x86_64' || 'arm64-v8a' }}" }
        run: |
          set -o pipefail
          CMAKE_BUILD_PARALLEL_LEVEL=3 ./gradlew assembleRelease -PreactNativeArchitectures=$ARCHS --no-daemon --max-workers=2 --stacktrace 2>&1 | tee ../../logs/apk-build.log || {
            grep -E "^e: |error:|ERROR" ../../logs/apk-build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::$(grep -A14 'What went wrong' ../../logs/apk-build.log | head -16 | tr '\n' ' ' | cut -c1-1800)"
            exit 1; }
      - name: The APK is signed with the Money app's certificate
        run: |
          APK=rn/android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 "certificate SHA-256 digest" certs.txt | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          WANT=$(python3 -c "import json; print(json.load(open('app/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")
          echo "APK certificate: $GOT"
          if [ -n "${MONEY_KEYSTORE:-}" ] && [ "$GOT" != "$WANT" ]; then echo "::error::The APK isn't signed with the Money app's key"; exit 1; fi
          cp "$APK" "money-rn-${{ github.run_number }}.apk"
          ls -la money-rn-*.apk
      - name: Put the APK and logs on the ci-rn branch (for review)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p share && cp money-rn-*.apk share/ 2>/dev/null || true
          cp -r logs share/logs 2>/dev/null || true
          cd share
          echo "From ${{ github.sha }} on ${{ github.ref_name }}, run ${{ github.run_number }}" > README.txt
          git init -q -b ci-rn
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Money RN build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-rn
      - name: GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "rn-${{ github.run_number }}" "money-rn-${{ github.run_number }}.apk" --latest=false \
            --title "Money RN · build ${{ github.run_number }}" \
            --notes "The React Native version of Money. It installs next to the Money app (it doesn't replace it). On your phone: download money-rn-${{ github.run_number }}.apk below and open it, then sign in with your email (a 6-digit code)."

  # Opens the APK in an Android emulator (on request: Actions → Money RN → Run workflow): does it start, what does the
  # first screen look like, and anything the app logged as an error. Pictures and the log go on the ci-rn-phone branch.
  emulator:
    if: github.event_name == 'workflow_dispatch'
    needs: [apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: The APK, from the ci-rn branch (the apk job put it there)
        run: |
          git fetch -q --depth 1 origin ci-rn && mkdir -p apk && git archive FETCH_HEAD | tar -x -C apk
          ls apk/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start it in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 6000M
          emulator-boot-timeout: 1800
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/rn/emulator.sh phone
      - name: Put the pictures and log on the ci-rn-phone branch
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p phone && cd phone
          echo "From ${{ github.sha }}, run ${{ github.run_number }}" > README.txt
          git init -q -b ci-rn-phone
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Money RN in the emulator, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-rn-phone
