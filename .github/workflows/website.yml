name: Website
# Puts the website live on Cloudflare Pages (yash-money.pages.dev) whenever main changes, once the checks pass. The
# website is the app's code (rn/) built for the browser by tools/build_site.py.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: { group: website-deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: rn
      - name: Build
        run: python3 tools/build_site.py
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set, so the website was not deployed"; exit 0; fi
          npx --yes wrangler@3.114.0 pages deploy dist --project-name yash-money --branch main --commit-hash "$(git rev-parse HEAD)"
      - name: Check the live site has this build
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          want=$(python3 -c "import json;print(json.load(open('dist/version.json'))['build'])")
          for i in 1 2 3 4 5 6; do
            got=$(curl -s "https://yash-money.pages.dev/version.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('build',''))" || true)
            echo "live build: $got (want $want)"; [ "$got" = "$want" ] && exit 0; sleep 10
          done
          echo "::error::the live site doesn't show this build yet"; exit 1
      - name: Sign-in links can open the app (assetlinks.json)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          # read it whole first: grep -q stops early, and under pipefail curl's cut-off counts as a failure
          body=$(curl -sf https://yash-money.pages.dev/.well-known/assetlinks.json)
          echo "$body" | grep -q com.yashdobal.money
