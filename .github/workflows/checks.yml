name: Checks
# On every push: the maths (the engine against the server's copy, India time against UTC, trips), then the website
# built from rn/ (tools/build_site.py) used like a person would, on the made-up demo data. Screenshots are kept for
# 3 days (Actions → this run → Artifacts).
on:
  push:
    branches-ignore: [ci-artifacts, ci-phone]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: rn
      - run: npm ci --prefix tools/ui --no-audit --no-fund
      - name: Browser for the tests
        working-directory: tools/ui
        run: npx playwright install --with-deps chromium
      - name: Build the website
        run: python3 tools/build_site.py
      - name: The engine's copies are up to date, the app's equals the server's, and India time equals UTC
        run: |
          node tools/rn_engine.mjs --check
          node tools/rn/engine.test.mjs
          node tools/engine/ist.test.mjs
      - name: "Trips on points: the maths against figures worked out by hand"
        run: node tools/rn/trips.test.mjs
      - name: "The app, clicked through: add, search, edit, balances, hide amounts, plan, goals, cards, trips, settings"
        run: node tools/ui/rn.click.test.mjs
      - name: "The website: screens moving, address and Back, the lock, carry-over, alerts, laptop layout, inside the Android app"
        run: node tools/ui/site.test.mjs
      - name: Screenshots (phone and laptop, light and dark)
        continue-on-error: true   # pictures for a person to look at, not a check
        env: { SHOT_MAX: "2400" }
        run: node tools/ui/site.shots.mjs site-shots
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact store must not fail the checks
        if: always()
        with: { name: site-screenshots, path: site-shots, retention-days: 3 }
