name: Checks
# On every push: the engine (every figure against the recorded answers, figures worked out by hand, scrambled data,
# bank SMS), the server's engine under Deno in UTC, then the website built and used like a person would on the
# made-up demo data. Screenshots are kept for 3 days (Actions → this run → Artifacts).
on:
  push:
    branches-ignore: [ci-artifacts, ci-phone]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: "The engine: 42 moments and 102 changes as recorded, Trips and Rewards by hand, scrambled data, bank SMS"
        working-directory: rust
        run: cargo test -p money-core -p money-server -- --nocapture
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust, key: server }
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen@0.2.130 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g binaryen@132.0.0 --no-audit --no-fund
      - run: ./rust/server/build.sh
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: The functions type-check, and give the app's widget and summary in UTC
        run: |
          (cd supabase/functions && deno check notify/index.ts device/index.ts app/index.ts ingest/index.ts)
          (cd rust/server && TZ=UTC deno test --allow-read --no-check deno.test.ts)
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust, key: wasm }
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen@0.2.130 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: wasm-opt (shrinks the WebAssembly by about a third)
        run: npm i -g binaryen@132.0.0 --no-audit --no-fund
      - name: Build the website
        run: ./rust/build-web.sh
      - run: npm ci --prefix tools/ui --no-audit --no-fund
      - name: Browser for the tests
        working-directory: tools/ui
        run: npx playwright install --with-deps chromium
      - name: "The website used like a person would: every tab and sheet, add, search, edit, settings, phone and laptop, light and dark"
        run: node tools/ui/app.test.mjs site-shots
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact store must not fail the checks
        if: always()
        with: { name: site-screenshots, path: site-shots, retention-days: 3 }
